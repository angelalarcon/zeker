<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" preserveAspectRatio="xMidYMax slice"><style>@keyframes drift{from{transform:translateX(-26px)}to{transform:translateX(26px)}}.drift{animation:drift 26s ease-in-out infinite alternate}.drift.slow{animation-duration:40s}@keyframes fly{from{transform:translate(0,0)}to{transform:translate(-160px,-24px)}}.fly{animation:fly 30s linear infinite alternate}@media (prefers-reduced-motion:reduce){.drift,.fly{animation:none}}</style><path d="M548,450 l8,-56 h40 l8,56 z" fill="#C9573A"/><path d="M576,394 h20 l8,56 h-20 z" fill="#A8432E"/><circle cx="566" cy="380" r="22" fill="#4F9460"/><circle cx="590" cy="372" r="18" fill="#82B862"/><circle cx="578" cy="356" r="16" fill="#4F9460"/><circle cx="572" cy="352" r="7" fill="#D3E28F" opacity=".7"/></svg>
